<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>剖腹产择日 · 在医生给你的那几天里，哪天最合适</title>
<style>
  :root{
    --bg:#faf9f7; --card:#fff; --ink:#1f1d1b; --ink2:#5c5754; --ink3:#8d8681;
    --line:#e8e3dd; --accent:#9c3d2e; --accent-soft:#f6edea;
    --ok:#2f7a55; --no:#b0553f; --warn:#a8761f;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 60px;
  }
  .wrap{max-width:660px;margin:0 auto;padding:0 18px}

  header{padding:34px 0 22px;text-align:left}
  header h1{font-size:23px;line-height:1.4;margin:0 0 8px;letter-spacing:.2px;font-weight:600}
  header p{margin:0;color:var(--ink2);font-size:14px}
  header .rule{width:44px;height:3px;background:var(--accent);border-radius:2px;margin:16px 0 0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 14px;color:var(--ink2);font-weight:600;letter-spacing:.3px}

  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
  .field input[type=date]{
    width:100%;min-width:0;max-width:100%;padding:11px 12px;font-size:15px;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;background:#fdfcfb;
    font-family:inherit;appearance:none;
  }
  .field input:focus{outline:none;border-color:var(--accent);background:#fff}
  /* grid 子项默认 min-width:auto，会被 date input 的固有宽度撑破容器 —— 必须显式归零 */
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row2 > *{min-width:0;width:100%}

  .zodiacs{display:flex;flex-wrap:wrap;gap:8px}
  .zchip{position:relative;cursor:pointer}
  .zchip input{position:absolute;opacity:0;pointer-events:none}
  .zchip span{
    display:inline-block;padding:6px 13px;font-size:14px;
    border:1px solid var(--line);border-radius:999px;background:#fdfcfb;color:var(--ink2);
    transition:.15s;
  }
  .zchip input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}

  .btn{
    width:100%;padding:15px;font-size:16px;font-weight:600;font-family:inherit;
    color:#fff;background:var(--accent);border:0;border-radius:12px;cursor:pointer;
    letter-spacing:.5px;margin-top:4px;
  }
  .btn:disabled{background:#c9c3bd;cursor:not-allowed}
  .hint{font-size:12.5px;color:var(--ink3);margin-top:10px;text-align:center}
  .hint.err{color:var(--no)}

  #result h2{font-size:16px;margin:30px 0 12px;font-weight:600}
  #result h2:first-child{margin-top:22px}

  .tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
       border-radius:var(--radius);overflow:hidden;font-size:13.5px;table-layout:fixed}
  .tbl col.c1{width:16%} .tbl col.c2{width:12%} .tbl col.c3{width:24%}
  .tbl col.c4{width:16%} .tbl col.c5{width:9%} .tbl col.c6{width:9%} .tbl col.c7{width:14%}
  /* 前四列内容比别的长，一律不许换行，否则「不建议 40」「周日」会断成两行。
     必须限定 tr.row —— 展开行是「一个 colspan=7 的 td」，它同样是 nth-child(1)，
     会被这个选择器误伤，导致展开的长文字被 nowrap 裁掉。 */
  .tbl tr.row td:nth-child(-n+4){white-space:nowrap;font-size:12.5px}
  .tbl tr.exp > td{white-space:normal}
  .tbl td{word-break:break-word;overflow-wrap:anywhere}
  .tbl b.hit{color:#b0553f;font-weight:600;white-space:nowrap}
  .tbl th{background:#f5f2ef;color:var(--ink2);font-weight:600;font-size:12.5px;
          padding:9px 6px;text-align:left;white-space:nowrap}
  .tbl td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle}
  .tbl tr.dim{opacity:.45}
  .tbl td:last-child{font-size:12px;color:var(--ink3)}
  /* 点开看原因：17 天每一行都能展开，不该只有方案卡里那 3 天有解释 */
  .tbl tr.row{cursor:pointer}
  .tbl tr.row:hover td{background:#fdfcfb}
  .tbl tr.row td:first-child{white-space:nowrap}
  .caret{display:inline-block;margin-left:4px;font-size:9px;color:#b8b1aa;transition:.15s}
  .tbl tr.row.open .caret{transform:rotate(180deg);color:var(--accent)}
  .tbl tr.row.open td{background:#fdfcfb}
  .tbl tr.exp{display:none}
  .tbl tr.exp.show{display:table-row}
  .tbl tr.exp > td{padding:2px 10px 12px;border-top:0;background:#fdfcfb}
  .tbl tr.exp .reasons{margin:0}
  .tbl tr.exp .reasons li{font-size:12.5px;padding:3px 0 3px 19px;line-height:1.6}
  .tbl tr.exp .note{margin:0;font-size:12.5px}

  .tier{display:inline-block;padding:1px 7px;border-radius:5px;font-size:12px;font-weight:600}
  .t-首选{background:#e6f2ea;color:var(--ok)}
  .t-优选{background:#eef4e8;color:#4d7a2f}
  .t-可选{background:#f2f0ec;color:var(--ink2)}
  .t-次选{background:#fbf1e3;color:var(--warn)}
  .t-不建议{background:#f8e9e6;color:var(--no)}

  .plan{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:18px;margin-bottom:16px}
  .plan-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
         padding:3px 10px;border-radius:999px;letter-spacing:.3px}
  .plan-date{font-size:15px;font-weight:600}
  .plan-sub{font-size:12.5px;color:var(--ink3);margin-bottom:14px}

  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;
      border-top:1px dashed var(--line)}
  .kv:first-of-type{border-top:0}
  .kv > span{color:var(--ink2);flex:none}
  .kv > b{text-align:right;font-weight:600}
  .kv b.t-首选,.kv b.t-优选{color:var(--ok)}
  .kv b.t-次选{color:var(--warn)}
  .kv b.t-不建议{color:var(--no)}

  .reasons{list-style:none;padding:0;margin:10px 0 6px}
  .reasons li{position:relative;padding:5px 0 5px 20px;font-size:13.5px;line-height:1.6}
  .reasons li.ok:before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:700}
  .reasons li.no:before{content:"！";position:absolute;left:3px;color:var(--no);font-weight:700}
  .reasons li.no{color:var(--ink2)}

  .note{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:6px}
  .note.warn{color:var(--no)}

  .hrs{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .hrs-t{font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:8px}
  .hr{display:flex;align-items:baseline;gap:9px;padding:6px 0;font-size:13.5px;flex-wrap:wrap}
  .hr-i{width:17px;height:17px;flex:none;border-radius:50%;background:var(--accent-soft);
        color:var(--accent);font-size:11px;font-weight:700;text-align:center;line-height:17px}
  .hr-b{color:var(--ink3);font-size:12.5px}
  .hr-l{color:var(--ok);font-size:12.5px}
  .hr-r{color:var(--ink3);font-size:12px;width:100%;padding-left:26px}

  .ask{background:#f5f2ef;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:26px}
  .ask h3{font-size:14px;margin:0 0 10px;font-weight:600}
  .ask ol{margin:0 0 12px;padding-left:20px;font-size:13.5px;color:var(--ink2)}
  .ask ol li{margin-bottom:5px}

  /* 出图模式：把布局钳死在固定宽度，不依赖浏览器窗口宽度。
     命令行截图时窗口宽度和 CSS 视口宽度的换算关系不稳定，钳死它最省事。 */
  body.shot .wrap{width:390px;max-width:390px;margin:0 auto;padding:0 18px}

  /* ── 锁定模式（?lock=1）：这份链接是「为你生成的一份结果」，不是编辑器 ── */
  .lockbar{display:none;align-items:center;gap:8px;background:#f6edea;border:1px solid #e8d5cf;
           color:#7a3527;font-size:12.5px;line-height:1.5;border-radius:10px;
           padding:10px 13px;margin:0 0 14px}
  body.locked .lockbar{display:flex}
  body.locked .field input[type=date],
  body.locked .zchip input{cursor:default}
  body.locked .field input[type=date]{background:#f5f2ef;color:var(--ink2)}
  body.locked .zchip span{opacity:.55}
  body.locked #go{display:none}
  body.locked #status{display:none}

  /* ── 付费解锁的内容：父母生肖 + 时辰 ──
     注意：生肖区「要能点」——之前设成 pointer-events:none 是想做付费墙，
     结果用户以为界面坏了（真实用户反馈："无论电脑还是手机版都无法点选"），
     而且和「填入生肖会重算」的提示自相矛盾。改成：能点，点了引导去解锁。 */
  body:not(.unlocked) .zodiacs{opacity:.6}
  .lockhint{display:none;font-size:12.5px;line-height:1.6;color:#7a3527;background:#f6edea;
            border:1px solid #e8d5cf;border-radius:9px;padding:9px 11px;margin-top:8px}
  body:not(.unlocked) .lockhint{display:block}
  body.unlocked .zodiacs{opacity:1}
  body.unlocked .lockhint{display:none}
  .hourlock{font-size:12.5px;color:var(--ink3);line-height:1.6;margin-top:12px;
            padding-top:12px;border-top:1px solid var(--line)}
  .hourlock b{color:var(--accent)}

  /* 折叠的方案（免费版只给第一个完整的） */
  .folded{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
          padding:16px;margin-bottom:16px;text-align:center}
  .folded b{display:block;font-size:14px;margin-bottom:6px}
  .folded span{font-size:12.5px;color:var(--ink3);line-height:1.6}

  /* 底部行动区 */
  .cta{display:none;margin-top:26px;padding:18px;background:var(--card);
       border:1px solid var(--line);border-radius:var(--radius);text-align:center}
  /* 解锁钩子只给「还没解锁的人」看 —— 条件不能写 body.locked，
     因为首页模式（不带 lock=1）就没有 locked 类，那样入口会两边都不显示。 */
  body:not(.unlocked) .cta{display:block}
  body:not(.unlocked) #ctaShare{display:none}
  .cta .lead{font-size:13.5px;color:var(--ink2);margin:0 0 14px}
  .btn-ghost{display:block;width:100%;padding:13px;font-size:15px;font-weight:600;
             font-family:inherit;border-radius:11px;cursor:pointer;margin-bottom:10px;
             border:1px solid var(--accent);background:#fff;color:var(--accent)}
  .btn-ghost.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-ghost:last-child{margin-bottom:0}
  .cta .tip{font-size:12px;color:var(--ink3);margin:12px 0 0;line-height:1.6}
  .unlockbox{display:none;margin-top:14px;padding:14px;background:#f5f2ef;
             border-radius:10px;font-size:13px;color:var(--ink2);line-height:1.7;text-align:left}
  /* 付款区：必须画在页面上 —— 分享出去的人不在小红书、找不到你，
     如果这里只写「私信我」，这条转化路径就断了。 */
  .paybox{margin-top:12px;padding-top:12px;border-top:1px dashed #ddd6cf;text-align:center}
  .pay-price{font-size:19px;font-weight:700;color:var(--accent);margin-bottom:8px}
  .pay-step{font-size:12.5px;color:var(--ink2);line-height:1.7;margin:6px 0;text-align:left}
  .pay-qr{width:150px;height:150px;margin:8px auto;border:1px dashed #c9c3bd;border-radius:8px;
          display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3);
          background:#fff}
  /* 真实收款码是一张竖版海报，不能塞进正方形里 —— 自适应宽度 */
  img.pay-qr{width:100%;max-width:230px;height:auto;display:block;margin:10px auto;
             border:0;border-radius:10px}
  /* 自助解锁的输入行 */
  .payrow{display:flex;gap:8px;margin-top:12px}
  .payrow input{flex:1;min-width:0;padding:11px 12px;font-size:15px;font-family:inherit;
                border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;
                letter-spacing:1px}
  .payrow input:focus{outline:none;border-color:var(--accent)}
  .payrow button{flex:none;padding:11px 20px;font-size:15px;font-weight:600;font-family:inherit;
                 color:#fff;background:var(--accent);border:0;border-radius:10px;cursor:pointer}
  .paymsg{font-size:12.5px;margin-top:8px;min-height:16px;text-align:center}
  .paymsg.err{color:var(--no)}
  .paymsg.ok{color:var(--ok)}

  footer{margin-top:34px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.7}
  @media (max-width:400px){ .row2{grid-template-columns:1fr} header h1{font-size:20px} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>剖腹产择日</h1>
    <p>不是在算「哪天是吉日」，而是帮你从医生给的那几天里，挑出最合适的一天和一个时辰。</p>
    <div class="rule"></div>
  </header>

  <div class="lockbar">📋 这份是按你提供的预产期和医生给的窗口生成的，信息已固定。</div>

  <div class="card">
    <h2>填写信息</h2>
    <div class="field">
      <label>预产期</label>
      <input type="date" id="due">
    </div>
    <div class="field">
      <label>医生给的日期窗口</label>
      <div class="row2">
        <input type="date" id="from">
        <input type="date" id="to">
      </div>
    </div>
    <div class="field">
      <label>父母生肖（用于避开相冲的日子）</label>
      <div class="zodiacs" id="zodiacs"></div>
      <div class="lockhint">🔒 选好生肖后会<b>重算一遍</b>：把这段时间里正冲到你或先生的日子标出来、并排到后面。<br>这一项和下面的时辰建议一起解锁。</div>
    </div>
    <div class="field">
      <label>今天（用于判断预约是否来得及）</label>
      <input type="date" id="today">
    </div>
    <button class="btn" id="go" disabled>开始评估</button>
    <div class="hint" id="status">正在加载数据…</div>
  </div>

  <div id="result"></div>

  <div class="cta">
    <p class="lead">上面的日期排序是通用的。<br>真正跟你有关的，是下面这两件。</p>
    <button class="btn-ghost solid" id="unlock">解锁 · 避开相冲的日子 + 每天的最佳时辰</button>
    <div class="unlockbox" id="unlockbox"></div>
    <p class="tip">这几天里可能就有正冲你或先生的，但不知道你俩的生肖就算不出来。</p>
  </div>

  <div class="cta" id="ctaShare" style="text-align:center">
    <p class="lead" style="margin-bottom:12px">这不是通用工具，是有人按你的信息算的一份</p>
    <a class="btn-ghost" href="./" style="text-decoration:none;box-sizing:border-box">我也要算我自己的 →</a>
  </div>

  <footer>
    本工具提供的是传统民俗参考，不构成医疗建议。<br>
    最终日期与时辰请以产科医生和手术室排期为准。
  </footer>

</div>
<script src="pay-config.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
